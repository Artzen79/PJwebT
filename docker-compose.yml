services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: sporthub
      POSTGRES_PASSWORD: sporthub
      POSTGRES_DB: sporthub
      TZ: Asia/Bangkok
    ports:
      # host port: DB_PORT in .env, for machines where Windows has reserved 5432
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./apps/api/db/docker-init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  pgdata:
